# Substitui o src/main/resources/application.yaml durante os testes (test-classes vem primeiro no
# classpath), para que os testes rodem sem o Config Server. Os valores abaixo repetem os do
# repositório configurations (identity-<perfil>.yaml) de que os testes dependem.
spring:
  application:
    name: identity
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

app:
  jwt:
    audience: universum-api
    issuer: https://production.universum.api.br
