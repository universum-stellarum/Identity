spring:
  flyway:
    enabled: true
  datasource:
    # O INIT registra as funções do PostgreSQL usadas pela migration V3 (veja H2PostgresFunctions).
    url: >-
      jdbc:h2:mem:testdb;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL;INIT=
      CREATE ALIAS IF NOT EXISTS convert_to FOR "br.api.universum.identity.support.H2PostgresFunctions.convertTo"\;
      CREATE ALIAS IF NOT EXISTS sha256 FOR "br.api.universum.identity.support.H2PostgresFunctions.sha256"\;
      CREATE ALIAS IF NOT EXISTS encode FOR "br.api.universum.identity.support.H2PostgresFunctions.encode"
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  cache:
    type: none

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
